name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:4000
      # Database/API tests must run in CI (locally they are skipped when the stack is down).
      REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint and boundaries
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Start local Supabase (Postgres, Auth, REST, Storage, e-mail)
        run: |
          pnpm db:start
          node scripts/supabase-env.mjs >> "$GITHUB_ENV"
      - name: Test (unit, RLS, API integration)
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @nurion/web exec playwright install --with-deps chromium
      - name: End-to-end (panel in a real browser)
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
