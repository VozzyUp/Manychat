<!doctype html>
<html lang="pt-BR">
  <body
    style="
      font-family: Arial, sans-serif;
      color: #141a21;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px;
    "
  >
    <h2 style="margin: 0 0 12px">Criar uma nova senha</h2>
    <p>Recebemos um pedido para criar uma nova senha para o seu acesso ao Nurion Hub.</p>
    <p style="margin: 24px 0">
      <a
        href="{{ if .RedirectTo }}{{ .RedirectTo }}{{ else }}{{ .SiteURL }}/auth/confirm{{ end }}?token_hash={{ .TokenHash }}&type=recovery"
        style="
          background: #0f766e;
          color: #ffffff;
          padding: 12px 20px;
          border-radius: 8px;
          text-decoration: none;
          font-weight: bold;
        "
        >Criar nova senha</a
      >
    </p>
    <p style="color: #55606d; font-size: 13px">
      Se não foi você, ignore este e-mail: sua senha atual continua valendo.
    </p>
  </body>
</html>
